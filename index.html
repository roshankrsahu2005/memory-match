<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match - Concentration Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Canvas for sparkle particles on top of the container -->
        <canvas id="particle-canvas"></canvas>

        <!-- Hidden Category Selector (kept for JS references compatibility) -->
        <div class="category-selector" style="display: none;">
            <label for="category-select" class="sr-only">Select Category</label>
            <select id="category-select" class="category-dropdown">
                <option value="mixed" selected>Mixed (All)</option>
            </select>
        </div>
        
        <!-- Game Configurations (Difficulty and Mute Toggle) -->
        <div class="config-row">
            <div class="difficulty-selector">
                <span class="selector-label">Grid:</span>
                <div class="btn-group" role="radiogroup" id="difficulty-group" aria-label="Select difficulty">
                    <button class="diff-btn" data-grid="4" role="radio" aria-checked="false">4x4</button>
                    <button class="diff-btn" data-grid="6" role="radio" aria-checked="false">6x6</button>
                    <button class="diff-btn active" data-grid="8" role="radio" aria-checked="true">8x8</button>
                </div>
            </div>
            
            <button id="mute-btn" class="mute-btn" aria-label="Mute sound">
                <svg class="sound-icon unmuted" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
            </button>
        </div>
        
        <!-- Game Board -->
        <div class="game-board" id="game-board">
            <!-- Cards will be generated by JavaScript -->
        </div>
        
        <!-- Scoreboard -->
        <div class="scoreboard">
            <div class="moves-counter">
                <span class="label">Moves: </span>
                <span class="value" id="moves">0</span>
            </div>
            
            <div class="timer-counter">
                <span class="label">Time: </span>
                <span class="value" id="timer">00:00</span>
            </div>
            
            <div class="matches-counter">
                <span class="label">Matched: </span>
                <span class="value" id="matched">0</span> / <span id="total-pairs">32</span>
            </div>
            
            <div class="best-counter">
                <span class="label">Best: </span>
                <span class="value" id="best-score">-</span>
            </div>
        </div>
        
        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="restart-btn" id="restart-btn" aria-label="Restart game">Restart</button>
            <button class="shuffle-btn" id="shuffle-btn" aria-label="Shuffle cards">Shuffle</button>
        </div>
    </div>
    
    <!-- Victory Modal -->
    <div class="victory-modal" id="victory-modal" role="dialog" aria-modal="true" aria-labelledby="victory-title" hidden>
        <div class="victory-content">
            <h2 id="victory-title">Congratulations!</h2>
            
            <!-- Rank Badge Overlay -->
            <div class="rank-container">
                <div class="rank-badge" id="victory-rank">S</div>
                <div class="rank-label" id="victory-rank-label">Mastermind!</div>
            </div>

            <p>You matched all pairs in <span id="moves-count" class="moves-count">0</span> moves!</p>
            <p class="victory-time-desc">Time taken: <span id="time-count" class="time-count">00:00</span></p>
            <button class="play-again-btn" id="play-again-btn" aria-label="Play again">Play Again</button>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
